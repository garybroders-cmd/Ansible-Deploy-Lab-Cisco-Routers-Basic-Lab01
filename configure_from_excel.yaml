---
- name: Read interface data from Excel
  hosts: localhost
  gather_facts: no
  vars:
    excel_file: router_interfaces.xlsx
    excel_sheet: Interfaces
  tasks:
    - name: Run the spreadsheet reader
      ansible.builtin.command: python3 read_xlsx.py {{ excel_file }} {{ excel_sheet }}
      register: xlsx_out
      changed_when: false

    - name: Store the data for the router play
      ansible.builtin.set_fact:
        excel_data: "{{ xlsx_out.stdout | from_json }}"

- name: Configure routers from the spreadsheet
  hosts: routers
  gather_facts: no
  connection: ansible.netcommon.network_cli

  vars:
    clean_unlisted: false
    re_down_with_ip: '(?m)^(\S+)\s+\d+\.\d+\.\d+\.\d+\s+\S+\s+\S+\s+administratively down'
    re_any_with_ip: '(?m)^(\S+)\s+\d+\.\d+\.\d+\.\d+\s'
    re_unassigned_on: '(?m)^(\S+)\s+unassigned\s+\S+\s+\S+\s+(?:up|down)\s'
    re_mgmt_start: '(?m)^(\S+)\s+'
    re_mgmt_end: '\s'

  tasks:
    - name: Make sure this router is in the spreadsheet
      ansible.builtin.assert:
        that:
          - inventory_hostname in hostvars['localhost'].excel_data
        fail_msg: >-
          '{{ inventory_hostname }}' is not in the spreadsheet.
          Names in the sheet: {{ hostvars['localhost'].excel_data.keys() | list }}

    - name: Split spreadsheet interfaces into with-IP and blank-IP
      ansible.builtin.set_fact:
        sheet_all: "{{ hostvars['localhost'].excel_data[inventory_hostname] }}"
        sheet_with_ip: "{{ hostvars['localhost'].excel_data[inventory_hostname] | selectattr('ip_address', 'defined') | selectattr('subnet_mask',
 'defined') | list }}"
        sheet_blank_ip: "{{ hostvars['localhost'].excel_data[inventory_hostname] | rejectattr('ip_address', 'defined') | map(attribute='interface
') | list }}"

    - name: Read interface status
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: brief_start

    - name: Find the management interface Ansible is using
      ansible.builtin.set_fact:
        mgmt_if: "{{ brief_start.stdout[0] | regex_findall(re_mgmt_start ~ (ansible_host | regex_escape) ~ re_mgmt_end) | first | default('') }}"

    - name: Show protected management interface
      ansible.builtin.debug:
        msg: "Management interface (never touched): {{ mgmt_if if mgmt_if != '' else 'not found' }}"

    - name: Set IP address and description for spreadsheet interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item.interface }}"
        lines:
          - "description {{ item.description | default('Configured by Ansible') }}"
          - "ip address {{ item.ip_address }} {{ item.subnet_mask }}"
        save_when: modified
      loop: "{{ sheet_with_ip }}"
      loop_control:
        label: "{{ item.interface }} {{ item.ip_address }}"
      when: item.interface != mgmt_if

    - name: Force no shutdown on spreadsheet interfaces that have an IP
      cisco.ios.ios_config:
        parents: "interface {{ item.interface }}"
        lines:
          - no shutdown
        match: none
      loop: "{{ sheet_with_ip }}"
      loop_control:
        label: "{{ item.interface }}"
      when: item.interface != mgmt_if

    - name: Blank in spreadsheet - remove IP and shut down
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - no ip address
          - shutdown
        match: none
      loop: "{{ sheet_blank_ip }}"
      when: item != mgmt_if

    - name: Read interface status again
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: brief_mid

    - name: Work out what else needs cleaning up
      ansible.builtin.set_fact:
        unassigned_on: "{{ brief_mid.stdout[0] | regex_findall(re_unassigned_on) | difference([mgmt_if]) }}"
        unlisted_with_ip: "{{ (brief_mid.stdout[0] | regex_findall(re_any_with_ip)) | difference(sheet_all | map(attribute='interface') | list) |
 difference([mgmt_if]) }}"

    - name: Show cleanup plan
      ansible.builtin.debug:
        msg:
          unassigned_but_enabled: "{{ unassigned_on }}"
          has_ip_but_not_in_sheet: "{{ unlisted_with_ip }}"
          will_clear_unlisted: "{{ clean_unlisted | bool }}"

    - name: Interfaces with no IP - add no ip address and shut down
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - no ip address
          - shutdown
        match: none
      loop: "{{ unassigned_on }}"

    - name: Optional - clear and shut interfaces not in the spreadsheet
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - no ip address
          - shutdown
        match: none
      loop: "{{ unlisted_with_ip }}"
      when: clean_unlisted | bool

    - name: Read interface status before final enable
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: brief_late

    - name: Enable any remaining interface that has an IP address
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - no shutdown
        match: none
      loop: "{{ brief_late.stdout[0] | regex_findall(re_down_with_ip) }}"

    - name: Save the configuration
      cisco.ios.ios_config:
        save_when: always

    - name: Final interface status
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: brief_end

    - name: Confirm no interface with an IP is administratively down
      ansible.builtin.assert:
        that:
          - brief_end.stdout[0] | regex_findall(re_down_with_ip) | length == 0
        success_msg: "All interfaces with an IP address are enabled"
        fail_msg: "Some interfaces with an IP address are still shut down"

    - name: Confirm no unassigned interface is left enabled
      ansible.builtin.assert:
        that:
          - (brief_end.stdout[0] | regex_findall(re_unassigned_on) | difference([mgmt_if])) | length == 0
        success_msg: "All unassigned interfaces are shut down"
        fail_msg: "Some interfaces without an IP are still enabled"

    - name: Show final interface summary
      ansible.builtin.debug:
        msg: "{{ brief_end.stdout_lines[0] }}"
