---
- name: Push OSPF config generated from the spreadsheet
  hosts: routers
  gather_facts: no
  connection: ansible.netcommon.network_cli

  tasks:
    - name: Check a config file exists for this router
      ansible.builtin.stat:
        path: "ospf_configs/{{ inventory_hostname }}.cfg"
      delegate_to: localhost
      register: cfg

    - name: Push OSPF config
      cisco.ios.ios_config:
        src: "ospf_configs/{{ inventory_hostname }}.cfg"
        save_when: modified
      when: cfg.stat.exists

    - name: Check OSPF neighbours
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: nbr

    - name: Show neighbours
      ansible.builtin.debug:
        msg: "{{ nbr.stdout_lines[0] }}"
~
