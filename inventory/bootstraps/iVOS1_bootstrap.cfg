! Boot strap file


enable
configure terminal
hostname iVOS1
ip domain-name lab.local
!
username ansible privilege 15 secret StrongPass123
!
interface GigabitEthernet0/4
 description Management
 ip address 192.168.53.70 255.255.255.0
 no shutdown
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
enable secret StrongPass123
end
write memory
